server:
  port: 8080
  forward-headers-strategy: native

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ms-rutaexpress-bff

logging:
  level:
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

rutaexpress:
  secreto-interno: ${RUTAEXPRESS_SECRETO_INTERNO:}
  limite-tasa:
    capacidad: ${RUTAEXPRESS_LIMITE_TASA_CAPACIDAD:25}
    recarga-por-minuto: ${RUTAEXPRESS_LIMITE_TASA_RECARGA_POR_MINUTO:20}
    max-clientes: ${RUTAEXPRESS_LIMITE_TASA_MAX_CLIENTES:10000}
    expiracion-minutos: ${RUTAEXPRESS_LIMITE_TASA_EXPIRACION_MINUTOS:10}
  seguridad:
    jwt:
      tenant-id: ${AZURE_TENANT_ID:}
      audiencias: ${AZURE_API_AUDIENCIAS:}
  envios:
    url: ${RUTAEXPRESS_ENVIOS_URL:http://localhost:8081}
    connect-timeout: ${RUTAEXPRESS_ENVIOS_CONNECT_TIMEOUT:3000}
    read-timeout: ${RUTAEXPRESS_ENVIOS_READ_TIMEOUT:5000}
  catalogo:
    url: ${RUTAEXPRESS_CATALOGO_URL:http://localhost:8082}
    connect-timeout: ${RUTAEXPRESS_CATALOGO_CONNECT_TIMEOUT:3000}
    read-timeout: ${RUTAEXPRESS_CATALOGO_READ_TIMEOUT:5000}
  auditoria:
    url: ${RUTAEXPRESS_AUDITORIA_URL:http://localhost:8084}
    connect-timeout: ${RUTAEXPRESS_AUDITORIA_CONNECT_TIMEOUT:3000}
    read-timeout: ${RUTAEXPRESS_AUDITORIA_READ_TIMEOUT:5000}
  reportes:
    url: ${RUTAEXPRESS_REPORTES_URL:http://localhost:8086}
    connect-timeout: ${RUTAEXPRESS_REPORTES_CONNECT_TIMEOUT:3000}
    read-timeout: ${RUTAEXPRESS_REPORTES_READ_TIMEOUT:5000}
  notificaciones:
    url: ${RUTAEXPRESS_NOTIFICACIONES_URL:http://localhost:8083}
    connect-timeout: ${RUTAEXPRESS_NOTIFICACIONES_CONNECT_TIMEOUT:3000}
    read-timeout: ${RUTAEXPRESS_NOTIFICACIONES_READ_TIMEOUT:5000}
  mensajeria:
    url: ${RUTAEXPRESS_MENSAJERIA_URL:http://localhost:8087}
    connect-timeout: ${RUTAEXPRESS_MENSAJERIA_CONNECT_TIMEOUT:3000}
    read-timeout: ${RUTAEXPRESS_MENSAJERIA_READ_TIMEOUT:5000}
